<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KNChat — Private. Secure. Yours.</title>
  
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1dI55bE4KZBPEvZKj5RdTAwpJh4yne-KO">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1dI55bE4KZBPEvZKj5RdTAwpJh4yne-KO">
  <meta name="theme-color" content="#07090e">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(15, 18, 28, 0.85);
      --accent-blue: #0088ff;
      --accent-purple: #8b2fc9;
      --gradient-primary: linear-gradient(135deg, #0088ff 0%, #8b2fc9 100%);
      --text-main: #f0f3f9;
      --text-muted: #8a94a6;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 480px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 481px) {
      .app-card {
        height: 92vh;
        max-height: 780px;
        border-radius: 28px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 0, 0, 0.5);
      }
    }

    #auth-screen {
      padding: 30px 24px;
      text-align: center;
      justify-content: center;
      overflow-y: auto;
      position: relative;
    }

    .top-bar-home {
      position: absolute;
      top: 18px;
      right: 18px;
    }

    .admin-btn-home {
      background: rgba(139, 47, 201, 0.15);
      color: #c084fc;
      border: 1px solid rgba(139, 47, 201, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 12px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      animation: float 4s ease-in-out infinite;
    }

    .main-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .auth-title { 
      font-size: 30px; 
      font-weight: 800; 
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .title-kn { color: #0088ff; }
    .title-chat { color: #ffffff; opacity: 0.95; }
    
    .auth-subtitle { 
      font-size: 10px; 
      color: var(--text-muted); 
      margin-bottom: 28px; 
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .input-group { position: relative; margin-bottom: 12px; }
    .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    input[type="text"], select {
      width: 100%;
      background: rgba(10, 13, 20, 0.85);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 14px 14px 14px 46px;
      border-radius: 16px;
      font-size: 14px;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
      appearance: none;
    }

    .select-wrapper { position: relative; margin-bottom: 16px; }
    .select-wrapper::after {
      content: '\f0d7';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .btn-primary {
      width: 100%;
      background: var(--gradient-primary);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(0, 136, 255, 0.25);
    }

    /* Chat Header */
    .chat-header {
      padding: 12px 16px;
      background: rgba(10, 13, 20, 0.9);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    .back-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    .room-info { display: flex; flex-direction: column; gap: 2px; }
    .room-name-container { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background-color: #0088ff; border-radius: 50%; box-shadow: 0 0 8px #0088ff; }
    .room-name { font-weight: 700; font-size: 15px; }
    .online-count { font-size: 11px; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .clear-btn {
      background: rgba(248, 81, 73, 0.12);
      color: #ff7b72;
      border: 1px solid rgba(248, 81, 73, 0.25);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .alias-badge {
      background: rgba(0, 136, 255, 0.12);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 136, 255, 0.3);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .admin-badge {
      background: rgba(139, 47, 201, 0.2) !important;
      color: #c084fc !important;
      border-color: rgba(139, 47, 201, 0.4) !important;
    }

    #messages-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      position: relative;
    }

    .system-welcome-card {
      background: rgba(139, 47, 201, 0.08);
      border: 1px dashed rgba(139, 47, 201, 0.3);
      padding: 14px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 8px;
    }

    .welcome-title {
      font-size: 13px;
      font-weight: 700;
      color: #c084fc;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .welcome-text { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }

    .message {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
      cursor: pointer;
    }

    .message.outgoing {
      align-self: flex-end;
      background: var(--gradient-primary);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(0, 136, 255, 0.2);
    }

    .message.incoming {
      align-self: flex-start;
      background: rgba(22, 28, 42, 0.9);
      border: 1px solid var(--border-color);
      color: #e6edf3;
      border-bottom-left-radius: 4px;
    }

    .sender-tag { font-size: 10px; font-weight: 700; margin-bottom: 4px; display: block; opacity: 0.9; }

    /* Image Preview Message */
    .chat-img-msg {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 4px;
      display: block;
      cursor: pointer;
    }

    /* Voice Message Card Style */
    .audio-player-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.25);
      padding: 8px 12px;
      border-radius: 14px;
      margin-top: 4px;
      min-width: 180px;
    }

    .audio-play-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffffff;
      color: var(--accent-blue);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }

    .audio-wave-visual {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      height: 20px;
    }

    .audio-wave-bar {
      width: 3px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 3px;
      animation: wavePulse 1s infinite ease-in-out alternate;
    }

    /* Pop-up Reactions Style */
    .reaction-popup {
      position: absolute;
      top: -44px;
      background: rgba(15, 20, 32, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      z-index: 100;
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .message.outgoing .reaction-popup { right: 0; }
    .message.incoming .reaction-popup { left: 0; }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .react-emoji {
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .react-emoji:hover, .react-emoji:active {
      transform: scale(1.35);
    }

    .reactions-display {
      display: flex;
      gap: 4px;
      font-size: 11px;
      margin-top: 4px;
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 10px;
      width: fit-content;
    }

    .msg-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .read-receipt { font-size: 12px; }
    .read-receipt.seen { color: #00f0ff; }

    /* Typing Dot Indicator Style */
    .typing-indicator-box {
      font-size: 12px;
      color: #0088ff;
      font-weight: 600;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 13, 20, 0.95);
      border-top: 1px solid var(--border-color);
      width: 100%;
    }

    .typing-dots {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .typing-dots span {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #0088ff;
      animation: typingDots 1.4s infinite ease-in-out both;
    }

    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typingDots {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    /* Recording Pop-up Wave Bar Style */
    .recording-popup-bar {
      padding: 10px 16px;
      background: rgba(248, 81, 73, 0.15);
      border-top: 1px solid rgba(248, 81, 73, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rec-info {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ff7b72;
      font-size: 13px;
      font-weight: 700;
    }

    .wave-container {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 18px;
    }

    .wave-bar {
      width: 3px;
      height: 100%;
      background-color: #ff7b72;
      border-radius: 3px;
      animation: wavePulse 0.8s infinite ease-in-out alternate;
    }

    .wave-bar:nth-child(1) { animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { animation-delay: 0.3s; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { animation-delay: 0.4s; }
    .wave-bar:nth-child(5) { animation-delay: 0.15s; }

    @keyframes wavePulse {
      0% { height: 4px; }
      100% { height: 18px; }
    }

    .rec-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-rec-cancel {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .btn-rec-send {
      background: #ff7b72;
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .chat-input-area {
      padding: 12px 14px;
      background: rgba(10, 13, 20, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .chat-input-area input { flex: 1; margin-bottom: 0; }

    .action-icon-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .action-icon-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.12);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      background: var(--gradient-primary);
      border: none;
      color: white;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(139, 47, 201, 0.3);
    }

    /* Modal Styles */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: #0f131f;
      border: 1px solid var(--border-color);
      border-radius: 22px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .modal-title { font-size: 16px; font-weight: 700; color: #c084fc; }
    .close-modal-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }

    .notify-toggle-box {
      background: rgba(139, 47, 201, 0.1);
      border: 1px solid rgba(139, 47, 201, 0.3);
      padding: 12px 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .notify-info { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #e6edf3; }

    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2a3042; transition: .3s; border-radius: 24px;
    }

    .slider:before {
      position: absolute; content: "";
      height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }

    input:checked + .slider { background: var(--gradient-primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    .room-list-container {
      overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex: 1;
    }

    .admin-room-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .admin-room-name { font-size: 13px; font-weight: 600; color: #e6edf3; }
    .admin-item-actions { display: flex; gap: 6px; }

    .btn-small-join { background: var(--accent-blue); color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .btn-small-delete { background: rgba(248, 81, 73, 0.2); color: #ff7b72; border: 1px solid rgba(248, 81, 73, 0.3); padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; }

    #messages-container::-webkit-scrollbar { width: 3px; }
    #messages-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- ১. জয়েন স্ক্রিন -->
  <div id="auth-screen" class="app-card">
    <div class="top-bar-home">
      <button class="admin-btn-home" onclick="openAdminPanel()"><i class="fa-solid fa-user-gear"></i> Admin</button>
    </div>

    <div class="logo-wrapper">
      <img src="https://lh3.googleusercontent.com/d/1dI55bE4KZBPEvZKj5RdTAwpJh4yne-KO" alt="KNChat Logo" class="main-logo-img">
    </div>
    
    <div class="auth-title">
      <span class="title-kn">KN</span><span class="title-chat">Chat</span>
    </div>
    <div class="auth-subtitle">DEVELOPED BY KAZIM NAHIAN</div>
    
    <div class="input-group">
      <i class="fa-solid fa-key"></i>
      <input type="text" id="room-id-input" placeholder="Enter Secret Room Key" autocomplete="off">
    </div>

    <!-- Universal Room Dropdown Selector -->
    <div class="select-wrapper">
      <i class="fa-solid fa-vault" style="position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--text-muted); z-index:2;"></i>
      <select id="universal-room-select" onchange="selectUniversalRoom(this.value)">
        <option value="" disabled selected>Select Universal Vault Key...</option>
        <option value="Vault Alpha">Vault Alpha Key</option>
        <option value="Vault Beta">Vault Beta Key</option>
        <option value="Vault Omega">Vault Omega Key</option>
      </select>
    </div>

    <button id="join-btn" class="btn-primary">
      <span>Enter Chat Vault</span>
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <!-- ২. অ্যাডমিন প্যানেল মডাল -->
  <div id="admin-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-user-shield"></i> Admin Control Vault</div>
        <button class="close-modal-btn" onclick="closeAdminPanel()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="notify-toggle-box">
        <div class="notify-info">
          <i class="fa-solid fa-bell" style="color:#c084fc;"></i>
          <span>Global Live Notifications</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="admin-notify-toggle" onchange="toggleAdminNotifications(this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <div id="admin-room-list" class="room-list-container"></div>
    </div>
  </div>

  <!-- ৩. চ্যাট স্ক্রিন -->
  <div id="chat-screen" class="app-card hidden" onclick="closeAllPopups()">
    <div class="chat-header">
      <div class="header-left">
        <button class="back-btn" onclick="goHome()" title="Back to Home">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div class="room-info">
          <div class="room-name-container">
            <div class="status-dot"></div>
            <span id="room-title" class="room-name">Room</span>
          </div>
          <span id="online-count" class="online-count">1 Online</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="clear-btn" onclick="promptClearChat()"><i class="fa-solid fa-trash-can"></i> Clear</button>
        <span id="my-alias" class="alias-badge"></span>
      </div>
    </div>

    <div id="messages-container"></div>

    <!-- Live Typing Indicator Box -->
    <div id="typing-indicator" class="typing-indicator-box hidden">
      <span id="typing-user">Someone</span> is typing
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Live Recording Pop-up Wave Bar -->
    <div id="recording-popup" class="recording-popup-bar hidden">
      <div class="rec-info">
        <i class="fa-solid fa-microphone"></i>
        <span id="rec-timer">00:00</span>
        <div class="wave-container">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </div>
      <div class="rec-actions">
        <button class="btn-rec-cancel" onclick="cancelRecording()"><i class="fa-solid fa-xmark"></i></button>
        <button class="btn-rec-send" onclick="stopAndSendRecording()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

    <div class="chat-input-area">
      <!-- Hidden File Input for Images -->
      <input type="file" id="image-upload-input" accept="image/*" class="hidden" onchange="handleImageSelected(event)">
      
      <button class="action-icon-btn" onclick="triggerImageUpload()" title="Send Image">
        <i class="fa-solid fa-image"></i>
      </button>

      <button id="mic-btn" class="action-icon-btn" onclick="startRecording()" title="Record Voice">
        <i class="fa-solid fa-microphone"></i>
      </button>

      <input type="text" id="message-input" placeholder="Type message..." autocomplete="off">
      <button id="send-btn" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fchhellbumpddpwbcivy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_D_XeR8Leo24comyoGp1lSg_wosM-_7c';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const prefixes = ["Ghost", "Cipher", "Phantom", "Shadow", "Vortex", "Agent", "Nexus"];
    let myAlias = `${prefixes[Math.floor(Math.random() * prefixes.length)]}-${Math.floor(1000 + Math.random() * 9000)}`;
    let isAdminUser = false;
    let notificationsEnabled = false;
    let globalAdminChannel = null;

    let currentRoom = '';
    let roomChannel = null;
    let isUserScrolledUp = false;
    let typingTimeout = null;
    let popupTimer = null;

    // Recording variables
    let mediaRecorder = null;
    let audioChunks = [];
    let recTimerInterval = null;
    let secondsRecorded = 0;

    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const adminModal = document.getElementById('admin-modal');
    const roomIdInput = document.getElementById('room-id-input');
    const joinBtn = document.getElementById('join-btn');
    const roomTitle = document.getElementById('room-title');
    const myAliasSpan = document.getElementById('my-alias');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const onlineCountSpan = document.getElementById('online-count');
    const adminRoomList = document.getElementById('admin-room-list');
    const typingIndicator = document.getElementById('typing-indicator');
    const typingUser = document.getElementById('typing-user');
    const recordingPopup = document.getElementById('recording-popup');
    const recTimer = document.getElementById('rec-timer');

    if (myAliasSpan) myAliasSpan.innerText = myAlias;

    function selectUniversalRoom(val) {
      if (val) roomIdInput.value = val;
    }

    messagesContainer.addEventListener('scroll', () => {
      const threshold = 80;
      const position = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight;
      isUserScrolledUp = position > threshold;
    });

    function enterRoom() {
      const roomId = roomIdInput.value.trim();
      if (!roomId) return alert("Please enter a Room Key!");

      currentRoom = roomId;
      roomTitle.innerText = roomId;

      authScreen.classList.add('hidden');
      adminModal.classList.add('hidden');
      chatScreen.classList.remove('hidden');

      if (supabaseClient) {
        loadMessages(true);
        subscribeToRoom();
      }
    }

    function goHome() {
      if (roomChannel) supabaseClient.removeChannel(roomChannel);
      chatScreen.classList.add('hidden');
      authScreen.classList.remove('hidden');
      currentRoom = '';
    }

    joinBtn.addEventListener('click', enterRoom);
    roomIdInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') enterRoom(); });

    async function openAdminPanel() {
      const pwd = prompt("Enter Admin Password:");
      if (pwd === "ss43") {
        isAdminUser = true;
        myAlias = "Kazim Nahian (Admin)";
        myAliasSpan.innerText = myAlias;
        myAliasSpan.classList.add('admin-badge');

        await fetchAllActiveRooms();
        adminModal.classList.remove('hidden');
      } else if (pwd !== null) {
        alert("Incorrect Password!");
      }
    }

    function closeAdminPanel() { adminModal.classList.add('hidden'); }

    function toggleAdminNotifications(enabled) {
      notificationsEnabled = enabled;
      if (enabled) {
        if ("Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
        }
        startGlobalAdminListener();
        alert("Live Notifications Activated for Admin!");
      } else {
        if (globalAdminChannel) supabaseClient.removeChannel(globalAdminChannel);
      }
    }

    function startGlobalAdminListener() {
      if (!supabaseClient) return;

      globalAdminChannel = supabaseClient
        .channel('global_admin_notifications')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'room_messages' }, payload => {
          if (!notificationsEnabled) return;
          const msg = payload.new;

          const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
          audio.play().catch(() => {});

          if ("Notification" in window && Notification.permission === "granted") {
            new Notification(`KNChat Alert [${msg.room_id}]`, {
              body: `${msg.sender_alias}: ${msg.message_text}`,
              icon: 'https://lh3.googleusercontent.com/d/1dI55bE4KZBPEvZKj5RdTAwpJh4yne-KO'
            });
          }
        })
        .subscribe();
    }

    async function fetchAllActiveRooms() {
      if (!supabaseClient) return;

      const { data, error } = await supabaseClient
        .from('room_messages')
        .select('room_id');

      if (error) return;

      const uniqueRooms = [...new Set(data.map(item => item.room_id))];
      adminRoomList.innerHTML = '';

      if (uniqueRooms.length === 0) {
        adminRoomList.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px;">No Active Chat Rooms Found</div>`;
        return;
      }

      uniqueRooms.forEach(room => {
        const item = document.createElement('div');
        item.className = 'admin-room-item';
        item.innerHTML = `
          <span class="admin-room-name"><i class="fa-solid fa-hashtag" style="color:var(--accent-blue);"></i> ${escapeHTML(room)}</span>
          <div class="admin-item-actions">
            <button class="btn-small-join" onclick="adminJoinRoom('${escapeHTML(room)}')">Join</button>
            <button class="btn-small-delete" onclick="adminDeleteRoom('${escapeHTML(room)}')">Delete</button>
          </div>
        `;
        adminRoomList.appendChild(item);
      });
    }

    function adminJoinRoom(roomName) { 
      roomIdInput.value = roomName;
      enterRoom();
    }

    async function adminDeleteRoom(roomName) {
      if (!confirm(`Are you sure you want to delete room '${roomName}'?`)) return;

      const { error } = await supabaseClient.from('room_messages').delete().eq('room_id', roomName);
      if (!error) {
        alert(`Room '${roomName}' deleted successfully.`);
        fetchAllActiveRooms();
      }
    }

    // Input Trigger Typing Event
    messageInput.addEventListener('input', () => {
      if (roomChannel) {
        roomChannel.send({
          type: 'broadcast',
          event: 'typing',
          payload: { user: myAlias }
        });
      }
    });

    async function sendMessage(textPayload = null) {
      const text = textPayload || messageInput.value.trim();
      if (!text || !supabaseClient) return;

      if (!textPayload) messageInput.value = '';

      await supabaseClient.from('room_messages').insert([
        { room_id: currentRoom, sender_alias: myAlias, message_text: text }
      ]);
    }

    /* IMAGE UPLOAD HANDLER */
    function triggerImageUpload() {
      document.getElementById('image-upload-input').click();
    }

    function handleImageSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 2 * 1024 * 1024) {
        return alert("File size too large! Please upload images under 2MB.");
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Image = e.target.result;
        sendMessage(`[IMG]${base64Image}[/IMG]`);
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    /* VOICE RECORDING HANDLERS */
    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
          audioChunks.push(event.data);
        };

        mediaRecorder.start();

        recordingPopup.classList.remove('hidden');
        secondsRecorded = 0;
        recTimer.innerText = "00:00";

        recTimerInterval = setInterval(() => {
          secondsRecorded++;
          const mins = String(Math.floor(secondsRecorded / 60)).padStart(2, '0');
          const secs = String(secondsRecorded % 60).padStart(2, '0');
          recTimer.innerText = `${mins}:${secs}`;
        }, 1000);

      } catch (err) {
        alert("Microphone access denied or not supported!");
      }
    }

    function cancelRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      clearInterval(recTimerInterval);
      recordingPopup.classList.add('hidden');
    }

    function stopAndSendRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

      mediaRecorder.onstop = () => {
        clearInterval(recTimerInterval);
        recordingPopup.classList.add('hidden');

        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Audio = e.target.result;
          sendMessage(`[AUDIO]${base64Audio}[/AUDIO]`);
        };
        reader.readAsDataURL(audioBlob);
      };

      mediaRecorder.stop();
    }

    async function unsendMessage(msgId) {
      if (!confirm("Unsend this message?")) return;
      
      const { error } = await supabaseClient.from('room_messages').delete().eq('id', msgId);
      if (!error) {
        const el = document.getElementById(`msg-${msgId}`);
        if (el) el.remove();
      }
    }

    async function sendReaction(msgId, emoji) {
      if (roomChannel) {
        roomChannel.send({
          type: 'broadcast',
          event: 'reaction',
          payload: { msgId, emoji, user: myAlias }
        });
      }
      applyReaction(msgId, emoji, myAlias);
      closeAllPopups();
    }

    function applyReaction(msgId, emoji, user) {
      const container = document.getElementById(`reactions-${msgId}`);
      if (!container) return;
      
      let badge = container.querySelector(`[data-emoji="${emoji}"]`);
      if (badge) {
        let count = parseInt(badge.getAttribute('data-count')) + 1;
        badge.setAttribute('data-count', count);
        badge.innerText = `${emoji} ${count}`;
      } else {
        badge = document.createElement('span');
        badge.setAttribute('data-emoji', emoji);
        badge.setAttribute('data-count', '1');
        badge.innerText = `${emoji} 1`;
        container.appendChild(badge);
      }
    }

    function closeAllPopups() {
      if (popupTimer) clearTimeout(popupTimer);
      document.querySelectorAll('.reaction-popup').forEach(el => el.remove());
    }

    async function promptClearChat() {
      const pwd = prompt("Enter Master Password to delete all messages in this room:");
      if (pwd === "ss43") {
        await supabaseClient.from('room_messages').delete().eq('room_id', currentRoom);
        loadMessages(true);
      } else if (pwd !== null) {
        alert("Incorrect Password!");
      }
    }

    sendBtn.addEventListener('click', () => sendMessage());
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    async function loadMessages(autoScroll = false) {
      const SeventyTwoHoursAgo = new Date(Date.now() - (72 * 60 * 60 * 1000)).toISOString();

      const { data, error } = await supabaseClient
        .from('room_messages')
        .select('*')
        .eq('room_id', currentRoom)
        .gte('created_at', SeventyTwoHoursAgo)
        .order('created_at', { ascending: true });

      if (error) return;

      messagesContainer.innerHTML = `
        <div class="system-welcome-card">
          <div class="welcome-title"><i class="fa-solid fa-shield-halved"></i> KNChat Encrypted Vault</div>
          <div class="welcome-text">Created by <b>Kazim Nahian</b>. Private & Anonymous end-to-end environment.</div>
        </div>
      `;

      data.forEach(msg => appendMessage(msg, false));
      if (autoScroll) scrollToBottom();
      updateReadReceipts();
    }

    function updateReadReceipts() {
      const state = roomChannel ? roomChannel.presenceState() : {};
      const onlineUsers = Object.keys(state).length;

      document.querySelectorAll('.read-receipt').forEach(el => {
        if (onlineUsers > 1) {
          el.innerHTML = '<i class="fa-solid fa-check-double"></i>';
          el.classList.add('seen');
        } else {
          el.innerHTML = '<i class="fa-solid fa-check"></i>';
          el.classList.remove('seen');
        }
      });
    }

    function subscribeToRoom() {
      if (roomChannel) supabaseClient.removeChannel(roomChannel);

      roomChannel = supabaseClient.channel(`room_${currentRoom}`, {
        config: { presence: { key: myAlias } }
      });

      roomChannel
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'room_messages',
          filter: `room_id=eq.${currentRoom}`
        }, payload => {
          if (payload.eventType === 'INSERT') {
            appendMessage(payload.new, true);
          } else if (payload.eventType === 'DELETE') {
            const el = document.getElementById(`msg-${payload.old.id}`);
            if (el) el.remove();
          }
        })
        .on('broadcast', { event: 'typing' }, payload => {
          if (payload.payload.user !== myAlias) {
            typingUser.innerText = payload.payload.user;
            typingIndicator.classList.remove('hidden');
            scrollToBottom();
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
              typingIndicator.classList.add('hidden');
            }, 2500);
          }
        })
        .on('broadcast', { event: 'reaction' }, payload => {
          if (payload.payload.user !== myAlias) {
            applyReaction(payload.payload.msgId, payload.payload.emoji, payload.payload.user);
          }
        })
        .on('presence', { sync: () => {
          const state = roomChannel.presenceState();
          const count = Object.keys(state).length;
          onlineCountSpan.innerText = `${count} Online`;
          updateReadReceipts();
        }})
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await roomChannel.track({ online_at: new Date().toISOString() });
          }
        });
    }

    function toggleAudioPlay(btn, audioSrc) {
      let audio = btn._audioInstance;
      if (!audio) {
        audio = new Audio(audioSrc);
        btn._audioInstance = audio;

        audio.onended = () => {
          btn.innerHTML = '<i class="fa-solid fa-play"></i>';
        };
      }

      if (audio.paused) {
        audio.play();
        btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      } else {
        audio.pause();
        btn.innerHTML = '<i class="fa-solid fa-play"></i>';
      }
    }

    function appendMessage(msg, isLiveNew = false) {
      if (document.getElementById(`msg-${msg.id}`)) return;

      const div = document.createElement('div');
      const isMyMessage = msg.sender_alias === myAlias;

      div.id = `msg-${msg.id}`;
      div.classList.add('message', isMyMessage ? 'outgoing' : 'incoming');

      const isAdminTag = msg.sender_alias.includes('Kazim Nahian');
      const state = roomChannel ? roomChannel.presenceState() : {};
      const isMultipleOnline = Object.keys(state).length > 1;

      let contentHTML = '';

      if (msg.message_text.startsWith('[IMG]') && msg.message_text.endsWith('[/IMG]')) {
        const imgSrc = msg.message_text.replace('[IMG]', '').replace('[/IMG]', '');
        contentHTML = `<img src="${imgSrc}" class="chat-img-msg" onclick="window.open('${imgSrc}')" />`;
      } else if (msg.message_text.startsWith('[AUDIO]') && msg.message_text.endsWith('[/AUDIO]')) {
        const audioSrc = msg.message_text.replace('[AUDIO]', '').replace('[/AUDIO]', '');
        contentHTML = `
          <div class="audio-player-box">
            <button class="audio-play-btn" onclick="toggleAudioPlay(this, '${audioSrc}')">
              <i class="fa-solid fa-play"></i>
            </button>
            <div class="audio-wave-visual">
              <div class="audio-wave-bar" style="height:12px;"></div>
              <div class="audio-wave-bar" style="height:18px;"></div>
              <div class="audio-wave-bar" style="height:8px;"></div>
              <div class="audio-wave-bar" style="height:15px;"></div>
              <div class="audio-wave-bar" style="height:10px;"></div>
            </div>
            <span style="font-size:11px; opacity:0.8;"><i class="fa-solid fa-microphone"></i> Voice</span>
          </div>
        `;
      } else {
        contentHTML = `<div>${escapeHTML(msg.message_text)}</div>`;
      }

      div.innerHTML = `
        <span class="sender-tag" style="${isAdminTag ? 'color:#c084fc;' : ''}">
          ${isAdminTag ? '<i class="fa-solid fa-crown"></i> Kazim Nahian (Admin)' : (isMyMessage ? 'You' : msg.sender_alias)}
        </span>
        ${contentHTML}

        <div id="reactions-${msg.id}" class="reactions-display"></div>

        <div class="msg-meta">
          <span>${new Date(msg.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          ${isMyMessage ? `<span class="read-receipt ${isMultipleOnline ? 'seen' : ''}">${isMultipleOnline ? '<i class="fa-solid fa-check-double"></i>' : '<i class="fa-solid fa-check"></i>'}</span>` : ''}
        </div>
      `;

      let pressTimer;

      const startPress = (e) => {
        pressTimer = setTimeout(() => {
          openReactionPopup(div, msg.id, isMyMessage);
        }, 350);
      };

      const cancelPress = () => clearTimeout(pressTimer);

      div.addEventListener('touchstart', startPress);
      div.addEventListener('touchend', cancelPress);
      div.addEventListener('touchmove', cancelPress);
      div.addEventListener('mousedown', startPress);
      div.addEventListener('mouseup', cancelPress);
      div.addEventListener('mouseleave', cancelPress);

      messagesContainer.appendChild(div);

      if (isLiveNew && (!isUserScrolledUp || isMyMessage)) {
        scrollToBottom();
      }
    }

    function openReactionPopup(msgElement, msgId, isMyMessage) {
      closeAllPopups();

      const popup = document.createElement('div');
      popup.className = 'reaction-popup';
      popup.onclick = (e) => e.stopPropagation();

      const emojis = ['👍', '❤️', '😂', '🔥', '😮'];
      emojis.forEach(emoji => {
        const span = document.createElement('span');
        span.className = 'react-emoji';
        span.innerText = emoji;
        span.onclick = () => sendReaction(msgId, emoji);
        popup.appendChild(span);
      });

      if (isMyMessage || isAdminUser) {
        const delBtn = document.createElement('span');
        delBtn.style.cssText = 'font-size:12px; color:#ff7b72; cursor:pointer; margin-left:4px; display:flex; align-items:center;';
        delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
        delBtn.onclick = () => { unsendMessage(msgId); closeAllPopups(); };
        popup.appendChild(delBtn);
      }

      msgElement.appendChild(popup);

      popupTimer = setTimeout(() => {
        popup.remove();
      }, 5000);
    }

    function scrollToBottom() { 
      messagesContainer.scrollTop = messagesContainer.scrollHeight; 
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
