<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberVault — Anonymous Chat</title>
  
  <!-- PWA Theme Color -->
  <meta name="theme-color" content="#0d1117">

  <!-- Inline Manifest for PWABuilder -->
  <link rel="manifest" href='data:application/json,{"short_name":"CyberVault","name":"CyberVault Anonymous Chat","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2092/2092663.png","sizes":"192x192","type":"image/png"},{"src":"https://cdn-icons-png.flaticon.com/512/2092/2092663.png","sizes":"512x512","type":"image/png"}],"start_url":"/","background_color":"#0d1117","theme_color":"#238636","display":"standalone"}'>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #0d1117, #010409);
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .hidden { display: none !important; }

    .app-card {
      background: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 420px;
      height: 620px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.4s ease-out;
    }

    #auth-screen {
      padding: 30px 25px;
      text-align: center;
      justify-content: center;
      overflow-y: auto;
    }

    .brand-icon {
      font-size: 45px;
      color: #238636;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(35, 134, 54, 0.5);
    }

    .auth-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .auth-subtitle { font-size: 12px; color: #8b949e; margin-bottom: 20px; }

    .input-group { position: relative; margin-bottom: 15px; }
    .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #8b949e; }

    input[type="text"] {
      width: 100%;
      background: rgba(13, 17, 23, 0.8);
      border: 1px solid #30363d;
      color: #fff;
      padding: 12px 12px 12px 42px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    input[type="text"]:focus { border-color: #238636; box-shadow: 0 0 10px rgba(35, 134, 54, 0.3); }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .admin-rooms-title {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-align: left;
    }

    .admin-rooms-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .room-card-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      border-radius: 10px;
      color: #c9d1d9;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: 0.2s;
    }

    .room-card-btn:hover { background: rgba(35, 134, 54, 0.15); border-color: #238636; }

    .chat-header {
      padding: 15px 18px;
      background: rgba(13, 17, 23, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .room-info { display: flex; flex-direction: column; gap: 2px; }
    .room-name-container { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background-color: #2ea043; border-radius: 50%; box-shadow: 0 0 8px #2ea043; }
    .room-name { font-weight: 600; font-size: 15px; }
    .online-count { font-size: 11px; color: #8b949e; }

    .alias-badge {
      background: rgba(56, 139, 253, 0.15);
      color: #58a6ff;
      border: 1px solid rgba(56, 139, 253, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    #messages-container {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
      animation: popIn 0.2s ease-out;
    }

    .message.outgoing {
      align-self: flex-end;
      background: linear-gradient(135deg, #1f6fed, #1158c7);
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .message.incoming {
      align-self: flex-start;
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-bottom-left-radius: 3px;
    }

    .sender-tag { font-size: 10.5px; font-weight: 700; margin-bottom: 3px; display: block; opacity: 0.8; }

    .unsend-btn {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      display: inline-block;
      cursor: pointer;
      text-align: right;
      width: 100%;
    }
    .unsend-btn:hover { color: #ff7b72; text-decoration: underline; }

    .chat-input-area {
      padding: 12px 18px;
      background: rgba(13, 17, 23, 0.8);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 8px;
    }

    .chat-input-area input { flex: 1; margin-bottom: 0; padding-left: 14px; }

    .send-btn {
      width: 44px;
      height: 44px;
      background: #238636;
      border: none;
      color: white;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 15px;
    }

    #messages-container::-webkit-scrollbar { width: 4px; }
    #messages-container::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <!-- ১. জয়েন স্ক্রিন -->
  <div id="auth-screen" class="app-card">
    <div class="brand-icon"><i class="fa-solid fa-user-shield"></i></div>
    <div class="auth-title">CyberVault Chat</div>
    <div class="auth-subtitle">End-to-End Anonymous Chat Room</div>
    
    <div class="input-group">
      <i class="fa-solid fa-key"></i>
      <input type="text" id="room-id-input" placeholder="Secret Room ID" autocomplete="off">
    </div>

    <button id="join-btn" class="btn-primary">
      <span>Enter Custom Room</span>
      <i class="fa-solid fa-arrow-right"></i>
    </button>

    <div class="admin-rooms-title">Built-in Vault Rooms</div>
    <div class="admin-rooms-grid">
      <div class="room-card-btn" onclick="quickJoin('Vault Alpha')">
        <span><i class="fa-solid fa-lock" style="color: #2ea043; margin-right: 6px;"></i> Vault Alpha</span>
        <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i>
      </div>
      <div class="room-card-btn" onclick="quickJoin('Vault Beta')">
        <span><i class="fa-solid fa-lock" style="color: #2ea043; margin-right: 6px;"></i> Vault Beta</span>
        <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i>
      </div>
      <div class="room-card-btn" onclick="quickJoin('Vault Omega')">
        <span><i class="fa-solid fa-lock" style="color: #2ea043; margin-right: 6px;"></i> Vault Omega</span>
        <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i>
      </div>
    </div>
  </div>

  <!-- ২. চ্যাট স্ক্রিন -->
  <div id="chat-screen" class="app-card hidden">
    <div class="chat-header">
      <div class="room-info">
        <div class="room-name-container">
          <div class="status-dot"></div>
          <span id="room-title" class="room-name">Room</span>
        </div>
        <span id="online-count" class="online-count">1 Online</span>
      </div>
      <span id="my-alias" class="alias-badge"></span>
    </div>

    <div id="messages-container"></div>

    <div class="chat-input-area">
      <input type="text" id="message-input" placeholder="Type encrypted message..." autocomplete="off">
      <button id="send-btn" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // Inline Service Worker Registration for PWABuilder
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => {});
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    const SUPABASE_URL = 'https://fchhellbumpddpwbcivy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_D_XeR8Leo24comyoGp1lSg_wosM-_7c';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const prefixes = ["Ghost", "Cipher", "Phantom", "Shadow", "Vortex", "Agent", "Nexus"];
    const myAlias = `${prefixes[Math.floor(Math.random() * prefixes.length)]}-${Math.floor(1000 + Math.random() * 9000)}`;

    let currentRoom = '';
    let roomChannel = null;
    let pollInterval = null;

    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const roomIdInput = document.getElementById('room-id-input');
    const joinBtn = document.getElementById('join-btn');
    const roomTitle = document.getElementById('room-title');
    const myAliasSpan = document.getElementById('my-alias');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const onlineCountSpan = document.getElementById('online-count');

    if (myAliasSpan) myAliasSpan.innerText = myAlias;

    function quickJoin(roomName) {
      roomIdInput.value = roomName;
      enterRoom();
    }

    function enterRoom() {
      const roomId = roomIdInput.value.trim();
      if (!roomId) return alert("Please enter a Room ID!");

      currentRoom = roomId;
      roomTitle.innerText = roomId;

      authScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');

      if (supabaseClient) {
        loadMessages();
        subscribeToRoom();

        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(loadMessages, 3000);
      }
    }

    joinBtn.addEventListener('click', enterRoom);
    roomIdInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') enterRoom(); });

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !supabaseClient) return;

      messageInput.value = '';

      await supabaseClient.from('room_messages').insert([
        { room_id: currentRoom, sender_alias: myAlias, message_text: text }
      ]);

      loadMessages();
    }

    async function unsendMessage(msgId) {
      if (!confirm("Unsend this message?")) return;
      
      const { error } = await supabaseClient
        .from('room_messages')
        .delete()
        .eq('id', msgId);

      if (!error) {
        const el = document.getElementById(`msg-${msgId}`);
        if (el) el.remove();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    async function loadMessages() {
      const { data, error } = await supabaseClient
        .from('room_messages')
        .select('*')
        .eq('room_id', currentRoom)
        .order('created_at', { ascending: true });

      if (error) return console.error(error);

      const currentIds = new Set(data.map(m => `msg-${m.id}`));
      
      Array.from(messagesContainer.children).forEach(child => {
        if (!currentIds.has(child.id)) child.remove();
      });

      data.forEach(msg => appendMessage(msg));
    }

    function subscribeToRoom() {
      if (roomChannel) supabaseClient.removeChannel(roomChannel);

      roomChannel = supabaseClient.channel(`room_${currentRoom}_${Date.now()}`, {
        config: { 
          presence: { key: myAlias },
          broadcast: { self: true }
        }
      });

      roomChannel
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'room_messages',
          filter: `room_id=eq.${currentRoom}`
        }, payload => {
          if (payload.eventType === 'INSERT') {
            appendMessage(payload.new);
            scrollToBottom();
          } else if (payload.eventType === 'DELETE') {
            const el = document.getElementById(`msg-${payload.old.id}`);
            if (el) el.remove();
          }
        })
        .on('presence', { sync: () => {
          const state = roomChannel.presenceState();
          const count = Object.keys(state).length;
          onlineCountSpan.innerText = `${count} Online`;
        }})
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await roomChannel.track({ online_at: new Date().toISOString() });
          } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
            setTimeout(subscribeToRoom, 1000);
          }
        });
    }

    function appendMessage(msg) {
      if (document.getElementById(`msg-${msg.id}`)) return;

      const div = document.createElement('div');
      const isMyMessage = msg.sender_alias === myAlias;

      div.id = `msg-${msg.id}`;
      div.classList.add('message', isMyMessage ? 'outgoing' : 'incoming');

      div.innerHTML = `
        <span class="sender-tag">${isMyMessage ? 'You' : msg.sender_alias}</span>
        ${escapeHTML(msg.message_text)}
        ${isMyMessage ? `<div class="unsend-btn" onclick="unsendMessage('${msg.id}')"><i class="fa-solid fa-trash"></i> Unsend</div>` : ''}
      `;

      messagesContainer.appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() { messagesContainer.scrollTop = messagesContainer.scrollHeight; }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && currentRoom) {
        loadMessages();
        subscribeToRoom();
      }
    });

    window.addEventListener("blur", () => { document.body.style.filter = "blur(18px)"; });
    window.addEventListener("focus", () => { document.body.style.filter = "none"; });
  </script>
</body>
</html>
