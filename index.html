  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(15, 18, 28, 0.85);
      --accent-blue: #0088ff;
      --accent-purple: #8b2fc9;
      --gradient-primary: linear-gradient(135deg, #0088ff 0%, #8b2fc9 100%);
      --text-main: #f0f3f9;
      --text-muted: #8a94a6;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 480px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 481px) {
      .app-card {
        height: 92vh;
        max-height: 780px;
        border-radius: 28px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 0, 0, 0.5);
      }
    }

    #auth-screen {
      padding: 30px 24px;
      text-align: center;
      justify-content: center;
      overflow-y: auto;
      position: relative;
    }

    .top-bar-home {
      position: absolute;
      top: 18px;
      right: 18px;
    }

    .admin-btn-home {
      background: rgba(139, 47, 201, 0.15);
      color: #c084fc;
      border: 1px solid rgba(139, 47, 201, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .admin-btn-home:hover {
      background: rgba(139, 47, 201, 0.3);
      box-shadow: 0 0 12px rgba(139, 47, 201, 0.4);
    }

    /* Clean & Sharp Logo Container */
    .logo-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto 12px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      animation: float 4s ease-in-out infinite;
    }

    .main-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    /* Title Balanced Styling */
    .auth-title { 
      font-size: 30px; 
      font-weight: 800; 
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .title-kn {
      color: #0088ff;
    }

    .title-chat {
      color: #ffffff;
      opacity: 0.95;
    }
    
    .auth-subtitle { 
      font-size: 10px; 
      color: var(--text-muted); 
      margin-bottom: 28px; 
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .input-group { position: relative; margin-bottom: 16px; }
    .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    input[type="text"] {
      width: 100%;
      background: rgba(10, 13, 20, 0.85);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 14px 14px 14px 46px;
      border-radius: 16px;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
      -webkit-user-select: text;
      user-select: text;
    }

    input[type="text"]:focus { 
      border-color: var(--accent-blue); 
      box-shadow: 0 0 12px rgba(0, 136, 255, 0.2); 
    }

    .admin-rooms-title {

      letter-spacing: 1.5px;

    .chat-header {

    .clear-btn {

      flex-direction: column;

      background: rgba(139, 47, 201, 0.08);

      padding: 14px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 8px;

    .welcome-title {

      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .welcome-text { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }

    .message {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
    }

    .message.outgoing {
      align-self: flex-end;
      background: var(--gradient-primary);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(0, 136, 255, 0.2);
    }

    .message.incoming {
      align-self: flex-start;
      background: rgba(22, 28, 42, 0.9);
      border: 1px solid var(--border-color);
      color: #e6edf3;
      border-bottom-left-radius: 4px;
    }

    .sender-tag { font-size: 10px; font-weight: 700; margin-bottom: 4px; display: block; opacity: 0.9; }

    .unsend-btn {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 5px;
      display: inline-block;
      cursor: pointer;
      text-align: right;
      width: 100%;
    }

    .chat-input-area {
      padding: 12px 14px;
      background: rgba(10, 13, 20, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input-area input { flex: 1; margin-bottom: 0; }

    .send-btn {
      width: 46px;
      height: 46px;
      background: var(--gradient-primary);
      border: none;
      color: white;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(139, 47, 201, 0.3);
      transition: all 0.2s;
    }

    .send-btn:active { transform: scale(0.95); }

    /* Modal Styles */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: #0f131f;
      border: 1px solid var(--border-color);
      border-radius: 22px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .modal-title { font-size: 16px; font-weight: 700; color: #c084fc; }
    .close-modal-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }

    .room-list-container {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .admin-room-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-room-name { font-size: 13px; font-weight: 600; color: #e6edf3; }

    .admin-item-actions { display: flex; gap: 6px; }

    .btn-small-join {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-small-delete {
      background: rgba(248, 81, 73, 0.2);
      color: #ff7b72;
      border: 1px solid rgba(248, 81, 73, 0.3);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    #messages-container::-webkit-scrollbar { width: 3px; }
    #messages-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
  </style>
</head>

  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => {});
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    const SUPABASE_URL = 'https://fchhellbumpddpwbcivy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_D_XeR8Leo24comyoGp1lSg_wosM-_7c';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const prefixes = ["Ghost", "Cipher", "Phantom", "Shadow", "Vortex", "Agent", "Nexus"];
    let myAlias = `${prefixes[Math.floor(Math.random() * prefixes.length)]}-${Math.floor(1000 + Math.random() * 9000)}`;
    let isAdminUser = false;

    let currentRoom = '';
    let roomChannel = null;
    let pollInterval = null;

    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const adminModal = document.getElementById('admin-modal');
    const roomIdInput = document.getElementById('room-id-input');
    const joinBtn = document.getElementById('join-btn');
    const roomTitle = document.getElementById('room-title');
    const myAliasSpan = document.getElementById('my-alias');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const onlineCountSpan = document.getElementById('online-count');
    const adminRoomList = document.getElementById('admin-room-list');

    if (myAliasSpan) myAliasSpan.innerText = myAlias;

    function quickJoin(roomName) {
      roomIdInput.value = roomName;
      enterRoom();
    }

    function enterRoom() {
      const roomId = roomIdInput.value.trim();
      if (!roomId) return alert("Please enter a Room ID!");

      currentRoom = roomId;
      roomTitle.innerText = roomId;

      authScreen.classList.add('hidden');
      adminModal.classList.add('hidden');
      chatScreen.classList.remove('hidden');

      if (supabaseClient) {
        loadMessages();
        subscribeToRoom();

        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(loadMessages, 3000);
      }
    }

    joinBtn.addEventListener('click', enterRoom);
    roomIdInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') enterRoom(); });

    async function openAdminPanel() {
      const pwd = prompt("Enter Admin Password:");
      if (pwd === "ss43") {
        isAdminUser = true;
        myAlias = "Kazim Nahian (Admin)";
        myAliasSpan.innerText = myAlias;
        myAliasSpan.classList.add('admin-badge');

        await fetchAllActiveRooms();
        adminModal.classList.remove('hidden');
      } else if (pwd !== null) {
        alert("Incorrect Password!");
      }
    }

    function closeAdminPanel() {
      adminModal.classList.add('hidden');
    }

    async function fetchAllActiveRooms() {
      if (!supabaseClient) return;

      const { data, error } = await supabaseClient
        .from('room_messages')
        .select('room_id');

      if (error) {
        alert("Error fetching rooms: " + error.message);
        return;
      }

      const uniqueRooms = [...new Set(data.map(item => item.room_id))];
      adminRoomList.innerHTML = '';

      if (uniqueRooms.length === 0) {
        adminRoomList.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px;">No Active Chat Rooms Found</div>`;
        return;
      }

      uniqueRooms.forEach(room => {
        const item = document.createElement('div');
        item.className = 'admin-room-item';
        item.innerHTML = `
          <span class="admin-room-name"><i class="fa-solid fa-hashtag" style="color:var(--accent-blue);"></i> ${escapeHTML(room)}</span>
          <div class="admin-item-actions">
            <button class="btn-small-join" onclick="adminJoinRoom('${escapeHTML(room)}')">Join</button>
            <button class="btn-small-delete" onclick="adminDeleteRoom('${escapeHTML(room)}')">Delete</button>
          </div>
        `;
        adminRoomList.appendChild(item);
      });
    }

    function adminJoinRoom(roomName) {
      quickJoin(roomName);
    }

    async function adminDeleteRoom(roomName) {
      if (!confirm(`Are you sure you want to delete room '${roomName}'?`)) return;

      const { error } = await supabaseClient
        .from('room_messages')
        .delete()
        .eq('room_id', roomName);

      if (!error) {
        alert(`Room '${roomName}' deleted successfully.`);
        fetchAllActiveRooms();
      } else {
        alert("Delete failed: " + error.message);
      }
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !supabaseClient) return;

      messageInput.value = '';

      await supabaseClient.from('room_messages').insert([
        { room_id: currentRoom, sender_alias: myAlias, message_text: text }
      ]);

      loadMessages();
    }

    async function unsendMessage(msgId) {
      if (!confirm("Unsend this message?")) return;
      
      const { error } = await supabaseClient
        .from('room_messages')
        .delete()
        .eq('id', msgId);

      if (!error) {
        const el = document.getElementById(`msg-${msgId}`);
        if (el) el.remove();
      }
    }

    async function promptClearChat() {
      const pwd = prompt("Enter Master Password to delete all messages in this room:");
      if (pwd === "ss43") {
        const { error } = await supabaseClient
          .from('room_messages')
          .delete()
          .eq('room_id', currentRoom);

        if (!error) {
          alert("All messages in this room have been cleared!");
          loadMessages();
        } else {
          alert("Failed to clear messages: " + error.message);
        }
      } else if (pwd !== null) {
        alert("Incorrect Password!");
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    async function loadMessages() {
      const SeventyTwoHoursAgo = new Date(Date.now() - (72 * 60 * 60 * 1000)).toISOString();

      const { data, error } = await supabaseClient
        .from('room_messages')
        .select('*')
        .eq('room_id', currentRoom)
        .gte('created_at', SeventyTwoHoursAgo)
        .order('created_at', { ascending: true });

      if (error) return console.error(error);

      messagesContainer.innerHTML = `
        <div class="system-welcome-card">
          <div class="welcome-title"><i class="fa-solid fa-shield-halved"></i> KNChat Encrypted Vault</div>
          <div class="welcome-text">Created by <b>Kazim Nahian</b>. Private & Anonymous end-to-end environment.</div>
        </div>
      `;

      data.forEach(msg => appendMessage(msg));
    }

    function subscribeToRoom() {
      if (roomChannel) supabaseClient.removeChannel(roomChannel);

      roomChannel = supabaseClient.channel(`room_${currentRoom}_${Date.now()}`, {
        config: { 
          presence: { key: myAlias },
          broadcast: { self: true }
        }
      });

      roomChannel
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'room_messages',
          filter: `room_id=eq.${currentRoom}`
        }, payload => {
          if (payload.eventType === 'INSERT') {
            appendMessage(payload.new);
            scrollToBottom();
          } else if (payload.eventType === 'DELETE') {
            loadMessages();
          }
        })
        .on('presence', { sync: () => {
          const state = roomChannel.presenceState();
          const count = Object.keys(state).length;
          onlineCountSpan.innerText = `${count} Online`;
        }})
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await roomChannel.track({ online_at: new Date().toISOString() });
          } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
            setTimeout(subscribeToRoom, 1000);
          }
        });
    }

    function appendMessage(msg) {
      if (document.getElementById(`msg-${msg.id}`)) return;

      const div = document.createElement('div');
      const isMyMessage = msg.sender_alias === myAlias;

      div.id = `msg-${msg.id}`;
      div.classList.add('message', isMyMessage ? 'outgoing' : 'incoming');

      const isAdminTag = msg.sender_alias.includes('Kazim Nahian');

      div.innerHTML = `
        <span class="sender-tag" style="${isAdminTag ? 'color:#c084fc;' : ''}">
          ${isAdminTag ? '<i class="fa-solid fa-crown"></i> Kazim Nahian (Admin)' : (isMyMessage ? 'You' : msg.sender_alias)}
        </span>
        ${escapeHTML(msg.message_text)}
        ${(isMyMessage || isAdminUser) ? `<div class="unsend-btn" onclick="unsendMessage('${msg.id}')"><i class="fa-solid fa-trash"></i> Delete</div>` : ''}
      `;

      messagesContainer.appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() { messagesContainer.scrollTop = messagesContainer.scrollHeight; }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && currentRoom) {
        loadMessages();
        subscribeToRoom();
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'PrintScreen' || (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u'))) {
        e.preventDefault();
        alert('Screenshots & saving are restricted for security!');
      }
    });
  </script>
</body>
